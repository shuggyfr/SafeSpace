<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, warm and calm
   IDEA a kitchen-table noticeboard: someone pins a problem, people who lived it leave advice
   PICTURE the feed itself, as a real shipped app
   COLOUR white ground, near-black ink, marigold field, coral for giving advice, sage for "been there"
   TYPE Familjen Grotesk + Inter
   LAYOUT one app column (max 640px) with sticky bar and floating Ask button; phone is the same column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141311);--ink:light-dark(#1b1a17,#f3efe6);--mute:light-dark(#6b6559,#a8a191);--line:light-dark(#ebe6da,#2c2a25);--card:light-dark(#ffffff,#1c1b18);--sun:light-dark(#ffc93c,#e0a91c);--sunink:#1b1a17;--coral:light-dark(#e8553a,#ff7a5c);--sage:light-dark(#dcefe0,#203a2a);--sageink:light-dark(#2d6a41,#a7dcb6);--soft:light-dark(#faf6ec,#1f1d19)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Familjen Grotesk",system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--sun);z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sun);color:var(--sunink)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Familjen Grotesk";font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo svg{width:30px;height:30px}
.bar .sp{flex:1}
.back{border:0;background:none;font-weight:600;padding:8px 4px;display:flex;align-items:center;gap:6px;color:var(--sunink)}
.hero{background:var(--sun);color:var(--sunink);padding-block:8px 22px}
.hero h1{font-size:clamp(30px,7vw,42px);font-weight:700;max-width:14em}
.hero p{margin:8px 0 0;font-size:16px;max-width:34em;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sort{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sort button{border:0;background:none;padding:10px 0;font-size:14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.sort button[aria-pressed=true]{color:var(--ink);border-color:var(--coral)}
.post{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:18px 0}
.post:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#1b1a17;flex:none}
.name{font-weight:600;color:var(--ink)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute)}
.solved{background:var(--sage);color:var(--sageink)}
.post h3{font-size:20px;font-weight:600;margin:10px 0 6px}
.post p{margin:0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--mute);font-weight:500}
.stats b{color:var(--ink)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--coral);color:#fff;font-weight:600;font-size:16px;border-radius:99px;padding:15px 22px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--coral) 35%,transparent)}
@media(min-width:760px){.fab{right:calc(50% - 320px)}}
.detail{padding-block:20px 120px}
.detail h2{font-size:clamp(26px,6vw,34px);font-weight:700;margin:14px 0 12px}
.detail .body{font-size:17px;white-space:pre-line}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 16px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;min-height:44px}
.pill[aria-pressed=true]{background:var(--sage);color:var(--sageink);border-color:transparent}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 6px;padding-top:20px;border-top:1px solid var(--line)}
.sec h3{font-size:20px}
.sec span{font-size:13px;color:var(--mute)}
.adv{padding:16px 0;border-bottom:1px solid var(--line)}
.adv.best{background:var(--sage);border:0;border-radius:16px;padding:16px;margin:10px 0}
.adv .txt{margin:10px 0 0;white-space:pre-line}
.lived{font-size:12px;font-weight:600;color:var(--sageink)}
.adv .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adv .row .pill{min-height:36px;padding:6px 12px;font-size:13px}
.best .pill{background:transparent;border-color:color-mix(in srgb,var(--sageink) 30%,transparent)}
.bestlbl{font-size:13px;font-weight:700;color:var(--sageink);margin-bottom:8px}
.give{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.give form{display:flex;flex-direction:column;gap:8px}
.give .r{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],select{font:16px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);border-radius:14px;padding:12px 14px;width:100%}
textarea{resize:none}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--coral);outline-offset:1px}
.send{border:0;background:var(--coral);color:#fff;font-weight:600;border-radius:14px;padding:0 18px;height:48px;flex:none}
.send:disabled{opacity:.45;cursor:default}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:var(--coral)}
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:92svh;overflow:auto}
.panel h2{font-size:28px;margin-bottom:4px}
.panel .sub{color:var(--mute);margin:0 0 16px}
.panel label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.panel .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;align-items:center}
.ghost{border:0;background:none;padding:12px;font-weight:600;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.note{font-size:13px;color:var(--mute);padding-block:24px 110px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;z-index:50}
.bell{position:relative;border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--sunink);border-radius:50%}
.bell:hover{background:color-mix(in srgb,#000 8%,transparent)}
.dot{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sun)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;border:0;background:color-mix(in srgb,#000 8%,transparent);color:var(--sunink);border-radius:99px;padding:4px 12px 4px 4px}
.note-i{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 0}
.note-i.unread{position:relative}
.note-i.unread::after{content:"";position:absolute;right:2px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.note-i .tx{flex:1;padding-right:18px}
.note-i .tx b{font-weight:600}
.note-i .q{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.note-i .when{font-size:13px;color:var(--mute);margin-top:4px;display:block}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--sageink);font-size:14px;font-weight:700;flex:none}
.alias{display:grid;grid-template-columns:minmax(0,1fr) 8.5em;gap:8px}
.idcard{background:var(--soft);border-radius:16px;padding:16px;margin:16px 0 4px;display:flex;gap:12px;align-items:center}
.idcard .av{width:44px;height:44px;font-size:18px}
.idcard p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--coral);font-weight:600;padding:8px 0;margin-left:auto}
</style>
</head><body>

<header class="bar"><div class="wrap" id="barIn"></div></header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
{
const CATS=["All","Life advice","Family","Home & body","Work & school","Money","Weird & niche"];
const COLORS=["#ffc93c","#9fd8b0","#ffb4a2","#b9d3ff","#f5c2e7","#d9e88f"];
const now=Date.now(),H=36e5;
const seed=[
 {id:1,author:"Tolu",cat:"Weird & niche",t:now-5*H,title:"I stub my toe on the same door every single morning",body:"Bedroom door, right foot, every morning on the way to the bathroom. I know it's there. I still hit it. Am I cursed or is there an actual reason this keeps happening?",relate:41,best:11,cents:[
  {id:11,author:"Marcus",pron:"his",lived:true,t:now-4*H,txt:"Same thing happened to me for a year. It was the door, not me. When you wake up you walk the line your feet learned, and my door was opened about 20cm less than it used to be because a laundry basket moved behind it. Open it fully or leave it fully shut every night so the edge is always in the same place.\n\nAlso: a cheap motion nightlight at ankle height. Fixed it in a week.",helped:63},
  {id:12,author:"Lola",pron:"her",lived:true,t:now-3*H,txt:"Check whether you're turning before you're past the frame. Half-asleep you cut the corner. I put a small rug just past the door and it nudged my path wider.",helped:18},
  {id:13,author:"Grace",pron:"her",lived:false,t:now-2*H,txt:"Slippers by the bed. Not a fix for the cause but your toe will thank you.",helped:7}]},
 {id:2,author:"Kofi",cat:"Family",t:now-9*H,title:"My dad wasn't around. Who teaches you the stuff he would have?",body:"I'm 24. Nobody showed me how to shave properly, how to negotiate when buying a car, or how to tell when a friend is actually a bad influence. I feel behind on things everyone else just seems to know. Where did you learn this stuff?",relate:128,best:null,cents:[
  {id:21,author:"Uncle Dee",pron:"his",lived:true,t:now-8*H,txt:"Grew up the same way. What worked for me: pick one older man you respect (a coworker, a barber, a coach) and ask him one specific question. \"How do you deal with a car salesman?\" People love being asked. Over a few years you collect a whole set of dads.",helped:94},
  {id:22,author:"Femi",pron:"his",lived:true,t:now-6*H,txt:"Shaving: hot shower first, shave with the grain, rinse the blade every stroke, cold water after. Took me until 27 to learn that. You're not behind, you're just learning it on your own schedule.",helped:51}]},
 {id:3,author:"Priya",cat:"Work & school",t:now-26*H,title:"I freeze up every time I have to make a phone call",body:"Booking a doctor's appointment takes me three days of building up to it. Texting and email are fine. Has anyone actually got over this?",relate:212,best:31,cents:[
  {id:31,author:"Jamal",pron:"his",lived:true,t:now-24*H,txt:"Write a three-line script before you dial: who you are, what you want, one backup question. Keep it in front of you. Nobody on the other end knows you're reading. After ten calls with a script I stopped needing it.",helped:140},
  {id:32,author:"River",pron:"their",lived:true,t:now-20*H,txt:"Make the call within 60 seconds of deciding to. Every minute you wait the call gets bigger in your head.",helped:66}]},
 {id:4,author:"Kemi",cat:"Home & body",t:now-30*H,title:"Every plant I buy dies within a month",body:"I water them. I talk to them. Basil, a fern, even a cactus. Three weeks and they're gone. What am I missing?",relate:37,best:null,cents:[
  {id:41,author:"Ruth",pron:"her",lived:true,t:now-28*H,txt:"You are almost certainly overwatering. I killed eleven plants with love. Stick a finger 2cm into the soil and only water when it's dry at that depth. Cactus: once every two to three weeks, max.",helped:29}]},
 {id:5,author:"Zee",cat:"Life advice",t:now-50*H,title:"How do I tell my parents I'm leaving medicine?",body:"Second year of med school, and I know it's not for me. My parents sacrificed a lot to get me here. I want to do design. I don't know how to start that conversation without breaking their hearts.",relate:89,best:null,cents:[
  {id:51,author:"Ade",pron:"his",lived:true,t:now-47*H,txt:"I left law school. What helped: I came with a plan, not just a no. Which course, how I'd pay for it, what the first year looked like. My parents weren't upset that I was quitting, they were scared I'd have nothing. The plan answered the fear.",helped:77},
  {id:52,author:"Nkechi",pron:"her",lived:false,t:now-40*H,txt:"Thank them first, and mean it. Then tell them. Starting with gratitude changes how everything after it is heard.",helped:34}]},
 {id:6,mine:true,cat:"Money",t:now-20*H,title:"Friend borrowed money six months ago and acts like it never happened",body:"It's not a huge amount, but it's not nothing either. I don't want to lose the friendship. How do I bring it up?",relate:8,best:null,cents:[
  {id:61,author:"Kofi",pron:"his",lived:true,t:now-5*H,txt:"Keep it light and specific: \"Hey, any chance you can sort the £80 from March this month?\" Naming the amount and a time makes it a normal admin thing, not an accusation.",helped:12},
  {id:62,author:"Tina",pron:"her",lived:true,t:now-2*H,txt:"I waited a year with mine and it ate at me more than the money. Ask in person, not over text. Most people are embarrassed, not dodging you. Mine paid me back in two parts and we're still close.",helped:4}]}
];
const seedNotes=[
 {id:1,kind:"cents",who:"Tina",pron:"her",post:6,t:now-2*H,read:false},
 {id:2,kind:"cents",who:"Kofi",pron:"his",post:6,t:now-5*H,read:false},
 {id:3,kind:"been",n:8,post:6,t:now-12*H,read:true}
];
const BOTS=[["Tina","her","Been there. What helped me was writing down exactly what I'd tried so far, then changing one thing at a time. You'll spot the pattern faster than you think."],["Marcus","his","Had almost exactly this. Give it a week of trying one small change and come back and tell us how it went."],["River","their","You're not the only one, I promise. Start small, and be kind to yourself while you figure it out."]];
let S;
try{S=JSON.parse(localStorage.getItem("ss-state-v2")||"null")}catch(e){}
if(!S||!S.posts)S={posts:seed,notes:seedNotes,me:{alias:"Sunny",pron:"their"},relates:{},helps:{}};
const save=()=>{try{localStorage.setItem("ss-state-v2",JSON.stringify(S))}catch(e){}};
let cat="All",sort="fresh";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<24)return h+"h ago";const d=Math.round(h/24);return d+"d ago"};
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return COLORS[h%COLORS.length]};
const nm=x=>x.mine?S.me.alias:x.author;
const av=n=>`<span class="av" style="background:${col(n)}">${esc(n[0].toUpperCase())}</span>`;
const unread=()=>S.notes.filter(n=>!n.read).length;
const logo=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9a5 5 0 0 1 5-5h12a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-7l-6 5v-5H10a5 5 0 0 1-5-5z" fill="#1b1a17"/><path d="M16 18.5s-5-3-5-6.2A2.6 2.6 0 0 1 16 11a2.6 2.6 0 0 1 5 1.3c0 3.2-5 6.2-5 6.2z" fill="#ffc93c"/></svg>`;
const bellIc=`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const backIc=`<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const centsLine=n=>n===1?"1 person gave their 2 cents":n+" people gave their 2 cents";
function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function bar(left){const u=unread();$("#barIn").innerHTML=`${left}<span class="sp"></span><button class="me" id="meB" title="Your alias">${av(S.me.alias)}${esc(S.me.alias)}</button><button class="bell" id="bellB" aria-label="Notifications${u?", "+u+" new":""}">${bellIc}${u?`<span class="dot">${u}</span>`:""}</button>`;$("#bellB").onclick=()=>{location.hash="inbox"};$("#meB").onclick=aliasSheet;const b=$("#back");if(b)b.onclick=()=>{history.length>1?history.back():location.hash=""}}

function feed(){
 bar(`<div class="logo">${logo}SafeSpace</div>`);
 let list=S.posts.filter(p=>cat==="All"||p.cat===cat||(cat==="Mine"&&p.mine));
 if(sort==="fresh")list.sort((a,b)=>b.t-a.t);
 else if(sort==="helped")list.sort((a,b)=>b.relate-a.relate);
 else list=list.filter(p=>!p.cents.length).sort((a,b)=>b.t-a.t);
 $("#app").innerHTML=`<section class="hero"><div class="wrap"><h1>Someone has been through it. Ask them.</h1><p>Post the thing that's been bugging you, big or tiny. Everyone here goes by an alias, and people who lived it give their 2 cents.</p></div></section>
 <div class="wrap"><nav class="chips" aria-label="Topics">${[...CATS,"Mine"].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${c==="Mine"?"My posts":esc(c)}</button>`).join("")}</nav>
 <div class="sort">${[["fresh","Fresh"],["helped","Most been there"],["none","Waiting for 2 cents"]].map(([k,l])=>`<button data-sort="${k}" aria-pressed="${k===sort}">${l}</button>`).join("")}</div>
 ${list.length?list.map(p=>`<button class="post" data-open="${p.id}"><div class="meta">${av(nm(p))}<span class="name">${esc(nm(p))}${p.mine?" (you)":""}</span><span>${ago(p.t)}</span><span class="tag">${esc(p.cat)}</span>${p.best?`<span class="tag solved">Sorted</span>`:""}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="stats"><span><b>${p.relate}</b> been there</span><span><b>${p.cents.length}</b> × 2 cents</span></div></button>`).join(""):`<div class="empty">${cat==="Mine"?"You haven't asked anything yet. Tap Ask to share what's on your mind.":"Nothing waiting here right now."}</div>`}
 <p class="note">Prototype with sample posts. Anything you add stays in this browser only.</p></div>
 <button class="fab" id="ask"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Ask</button>`;
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;feed()});
 document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{sort=b.dataset.sort;feed()});
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{location.hash="post-"+b.dataset.open});
 $("#ask").onclick=compose;
}

function detail(p){
 bar(`<button class="back" id="back">${backIc}Back</button>`);
 const rel=!!S.relates[p.id];
 const list=[...p.cents].sort((a,b)=>(b.id===p.best)-(a.id===p.best)||b.helped-a.helped);
 const one=a=>{const h=!!S.helps[a.id],best=a.id===p.best;return`<article class="adv${best?" best":""}">${best?`<div class="bestlbl">✓ ${p.mine?"You":esc(nm(p))} said this sorted it</div>`:""}<div class="meta">${av(nm(a))}<span class="name">${esc(nm(a))}${a.mine?" (you)":""}</span><span>${ago(a.t)}</span>${a.lived?`<span class="lived">Been through it</span>`:""}</div><p class="txt">${esc(a.txt)}</p><div class="row"><button class="pill" data-help="${a.id}" aria-pressed="${h}">${h?"Helped you":"This helped"} · ${a.helped}</button>${p.mine&&!best&&!a.mine?`<button class="pill" data-best="${a.id}">Mark as what sorted it</button>`:""}</div></article>`};
 $("#app").innerHTML=`<div class="wrap detail"><div class="meta">${av(nm(p))}<span class="name">${esc(nm(p))}${p.mine?" (you)":""}</span><span>${ago(p.t)}</span><span class="tag">${esc(p.cat)}</span></div>
 <h2>${esc(p.title)}</h2><div class="body">${esc(p.body)}</div>
 <div class="acts">${p.mine?`<span class="pill" style="cursor:default">${p.relate} been there</span>`:`<button class="pill" id="rel" aria-pressed="${rel}">${rel?"You've been there too":"Been there"} · ${p.relate}</button>`}</div>
 <div class="sec"><h3>2 cents</h3><span>${centsLine(p.cents.length)}</span></div>
 ${list.length?list.map(one).join(""):`<div class="empty">No 2 cents yet. If you've lived this, you might be exactly who they need.</div>`}</div>
 <div class="give"><div class="wrap"><form id="gf"><div class="r"><textarea id="gtxt" rows="1" placeholder="${p.mine?"Add an update…":"Give your 2 cents…"}" aria-label="Your 2 cents"></textarea><button class="send" id="gsend" disabled>${p.mine?"Post":"Give 2 cents"}</button></div>${p.mine?"":`<label class="chk"><input type="checkbox" id="glived" checked>I've been through this myself</label>`}</form></div></div>`;
 const r=$("#rel");if(r)r.onclick=()=>{S.relates[p.id]=!rel;p.relate+=rel?-1:1;save();detail(p)};
 document.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>{const id=+b.dataset.help,a=p.cents.find(x=>x.id===id),on=!!S.helps[id];S.helps[id]=!on;a.helped+=on?-1:1;save();detail(p)});
 document.querySelectorAll("[data-best]").forEach(b=>b.onclick=()=>{p.best=+b.dataset.best;save();detail(p);toast("Marked as sorted. Thanks for closing the loop.")});
 const ta=$("#gtxt"),sb=$("#gsend");
 ta.oninput=()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,160)+"px";sb.disabled=!ta.value.trim()};
 $("#gf").onsubmit=e=>{e.preventDefault();const v=ta.value.trim();if(!v)return;const lv=$("#glived");p.cents.push({id:Date.now(),mine:true,lived:lv?lv.checked:true,t:Date.now(),txt:v,helped:0});save();detail(p);toast(p.mine?"Update posted.":"You gave your 2 cents. Someone needed that.");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
}

function inbox(){
 bar(`<button class="back" id="back">${backIc}Back</button>`);
 const list=[...S.notes].sort((a,b)=>b.t-a.t);
 const title=id=>{const p=S.posts.find(x=>x.id===id);return p?p.title:""};
 $("#app").innerHTML=`<div class="wrap detail"><h2>Notifications</h2>
 ${list.length?list.map(n=>`<button class="note-i${n.read?"":" unread"}" data-post="${n.post}">${n.kind==="cents"?av(n.who):`<span class="ic">✓</span>`}<span class="tx">${n.kind==="cents"?`<b>${esc(n.who)}</b> gave ${esc(n.pron)} 2 cents`:`<b>${n.n} people</b> have been there`}<span class="q">on “${esc(title(n.post))}”</span><span class="when">${ago(n.t)}</span></span></button>`).join(""):`<div class="empty">Nothing yet. When someone gives their 2 cents on your post, you'll see it here.</div>`}</div>`;
 document.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{location.hash="post-"+b.dataset.post});
 S.notes.forEach(n=>n.read=true);save();
}

function sheet(html){const d=document.createElement("div");d.className="sheet";d.innerHTML=html;document.body.appendChild(d);document.body.style.overflow="hidden";const close=()=>{d.remove();document.body.style.overflow=""};d.onclick=e=>{if(e.target===d)close()};d.querySelector(".ghost").onclick=close;return close}
const aliasFields=()=>`<div class="alias"><input type="text" id="aa" maxlength="20" value="${esc(S.me.alias)}" aria-label="Alias"><select id="ap" aria-label="How people refer to you">${["her","his","their"].map(x=>`<option value="${x}"${x===S.me.pron?" selected":""}>${x==="her"?"she / her":x==="his"?"he / his":"they / their"}</option>`).join("")}</select></div>`;
const readAlias=()=>{const a=$("#aa").value.trim();if(a)S.me.alias=a;S.me.pron=$("#ap").value};
function aliasSheet(){
 const close=sheet(`<form class="panel" id="af"><h2>Your alias</h2><p class="sub">This is who you are on SafeSpace. It feels like a real person, but it's never linked to your real name.</p>${aliasFields()}<p class="hint">Others will see things like “${esc(S.me.alias)} gave ${esc(S.me.pron)} 2 cents”.</p><div class="foot"><button type="button" class="ghost">Cancel</button><button class="send">Save</button></div></form>`);
 const hint=document.querySelector("#af .hint"),upd=()=>hint.textContent=`Others will see things like “${$("#aa").value.trim()||S.me.alias} gave ${$("#ap").value} 2 cents”.`;
 $("#aa").oninput=upd;$("#ap").onchange=upd;
 $("#af").onsubmit=e=>{e.preventDefault();readAlias();save();close();route();toast("Alias saved.")};
}
function compose(){
 const close=sheet(`<form class="panel" id="cf"><h2>What's on your mind?</h2><p class="sub">Big or tiny, someone out there has dealt with it.</p>
 <label for="ct">The short version</label><input type="text" id="ct" maxlength="120" placeholder="e.g. My neighbour's dog barks only when I'm on calls">
 <label for="cb">The details</label><textarea id="cb" rows="5" placeholder="What happens, what you've tried, what you'd love to know"></textarea>
 <label for="cc">Topic</label><select id="cc">${CATS.slice(1).map(c=>`<option>${esc(c)}</option>`).join("")}</select>
 <label for="aa">Posting as</label>${aliasFields()}
 <p class="hint">Your alias keeps you anonymous. Be kind, be specific.</p>
 <div class="foot"><button type="button" class="ghost">Cancel</button><button class="send" id="cs" disabled>Post</button></div></form>`);
 const chk=()=>$("#cs").disabled=!($("#ct").value.trim()&&$("#cb").value.trim());
 $("#ct").oninput=chk;$("#cb").oninput=chk;$("#ct").focus();
 $("#cf").onsubmit=e=>{e.preventDefault();readAlias();const p={id:Date.now(),mine:true,cat:$("#cc").value,t:Date.now(),title:$("#ct").value.trim(),body:$("#cb").value.trim(),relate:0,best:null,cents:[]};S.posts.unshift(p);save();close();location.hash="post-"+p.id;toast("Posted. 2 cents usually start coming in soon.");simulate(p)};
}
function simulate(p){
 const [who,pron,txt]=BOTS[Math.floor(Math.random()*BOTS.length)];
 setTimeout(()=>{p.relate+=3;p.cents.push({id:Date.now(),author:who,pron,lived:true,t:Date.now(),txt,helped:0});S.notes.push({id:Date.now(),kind:"cents",who,pron,post:p.id,t:Date.now(),read:false});save();route(true);toast(`${who} gave ${pron} 2 cents`)},7000);
}

function route(keep){
 const h=location.hash,m=h.match(/^#post-(\d+)$/);
 const p=m&&S.posts.find(x=>x.id===+m[1]);
 if(!keep)window.scrollTo(0,0);
 h==="#inbox"?inbox():p?detail(p):feed();
}
addEventListener("hashchange",()=>route());
route();
}
</script>
</body></html>
